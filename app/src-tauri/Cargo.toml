[package]
name = "tps-view"
version = "0.1.1"
description = "Open-source landmark digitizer for TPS files"
license = "MIT"
edition = "2021"

[lib]
name = "tps_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
